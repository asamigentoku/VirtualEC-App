services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Rails.cache のバックエンド（商品一覧などの読み取りキャッシュ）として利用
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 購入完了イベントなどを publish する Kafka ブローカー。
  # KRaftモードで動かすため Zookeeper は不要（Kafka単体で完結する）。
  # Apache Kafka公式イメージを使用（bitnami/kafka:3.7 は配布が終了しておりpullできないため）。
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # 商品の全文検索用インデックス。開発環境なのでセキュリティプラグインは無効化している。
  # OPENSEARCH_INITIAL_ADMIN_PASSWORD は「セキュリティプラグインを無効化する前」の
  # 起動スクリプト自体が必須チェックしてくる値のため、ダミーの開発用パスワードを設定している
  # （plugins.security.disabled: true にしていても、このチェックだけは省略できない）。
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "VirtualEC-dev-only!1"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  db_data:
  redis_data:
  kafka_data:
  opensearch_data: